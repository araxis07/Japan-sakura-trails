<!DOCTYPE html>

    <title>Sakura Trails | Japan Travel Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+Thai:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'sakura-pink': '#f4c6d5',
              'sakura-pink-soft': '#fbe6ec',
              'sakura-pink-dark': '#d8899d',

              display: ['Cormorant Garamond', 'serif'],

            boxShadow: {
